[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hlz-suitability-tool"
version = "0.7.0"
description = "Terrain-based helicopter landing-zone screening (ArcGIS Pro toolbox + CLI)"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Eui Soo SON" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
cli = ["rasterio>=1.3"]
test = ["pytest"]

[project.scripts]
hlz = "hlzcore.cli:main"

[tool.setuptools]
packages = ["hlzcore"]
